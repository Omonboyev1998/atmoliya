services:
  - type: web
    name: atmoliya-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        value: kafedra777
      - key: CARD_NUMBER
        value: 8600 0000 0000 0000
      - key: CARD_HOLDER
        value: Kafedra G'aznachisi
